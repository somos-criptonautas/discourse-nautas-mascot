search_locations:
  type: list
  list_type: compact
  default: "header|welcome-banner"
  choices:
    - header
    - welcome-banner
mascot_size:
  type: enum
  # integers, not strings: the admin dropdown casts choices to integers, so string ones never
  # match the saved value and it shows empty
  default: 48
  choices:
    - 32
    - 40
    - 48
mascot_style:
  type: enum
  default: figure
  choices:
    - figure
    - mask
